{% extends 'product/base.html' %}
{% block content %}
<h2>Редактирование профиля</h2>
<form class="row" method="post" enctype="multipart/form-data">
    <div class="card">
        <div class="card-body">
            <div class="card-body">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    {% if object %}
                    Сохранить
                    {% else %}
                    Создать
                    {% endif %}
                </button>
                <a href="{% url 'blog:blog_list' %}" class="btn btn-primary">Отменить</a>
            </div>
        </div>
    </div>
</form>
{% endblock %}
